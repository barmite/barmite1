<!DOCTYPE html>
<html lang=“en”>
<head>
  <meta charset=“UTF-8”>
  <title>Connect with Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .social-list {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
      list-style: none;
      padding: 0;
      margin: 20px 0 0 0;
    }
    .social-list a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }
    .social-list img {
      width: 50px;
      height: 50px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class=“container”>
    <h2>Send me information</h2>
    <ul class=“social-list”>
      <li>
        <a href=“https://mail.google.com/mail/?view=cm&fs=1&to=YOUR-EMAIL@gmail.com” target=“_blank”>
          <img src=“https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/120px-Google_%22G%22_logo.svg.png” alt=“Google”>
          Google
        </a>
      </li>
      <li>
        <a href=“https://compose.mail.yahoo.com/?to=YOUR-EMAIL@yahoo.com” target=“_blank”>
          <img src=“https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/Yahoo%21_logo.svg/120px-Yahoo%21_logo.svg.png” alt=“Yahoo”>
          Yahoo
        </a>
      </li>
      <li>
        <a href=“https://outlook.live.com/mail/0/deeplink/compose?to=YOUR-EMAIL@outlook.com” target=“_blank”>
          <img src=“https://upload.wikimedia.org/wikipedia/commons/thumb/d/df/Microsoft_Office_Outlook_%282018%E2%80%93present%29.svg/120px-Microsoft_Office_Outlook_%282018%E2%80%93present%29.svg.png” alt=“Outlook”>
          Outlook
        </a>
      </li>
      <li>
        <a href=“https://mail.aol.com/webmail-std/en-us/suite” target=“_blank”>
          <img src=“https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/AOL_logo_%282009%29.svg/120px-AOL_logo_%282009%29.svg.png” alt=“AOL”>
          AOL
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
